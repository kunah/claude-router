[project]
name = "claude-router"
version = "0.1.0"
description = "Route Claude Code sessions to the right account (CLAUDE_CONFIG_DIR) based on the current directory"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["claude", "claude-code", "accounts", "cli"]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
route-claude = "claude_router.route:main"
configure-route = "claude_router.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
